name: Sync upstream

on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/zpix1/windisplay.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "status=noop" >> "$GITHUB_OUTPUT"
            echo "already up to date"
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push clean merge
        if: steps.merge.outputs.status == 'merged'
        run: git push origin HEAD:main

      - name: Open PR on conflict
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git switch -c upstream-sync
          git merge --no-edit upstream/main || true
          git add -A
          git commit -m "chore: merge upstream/main (conflicts need resolution)"
          git push -f origin upstream-sync
          gh pr create --base main --head upstream-sync \
            --title "Sync with upstream (conflicts)" \
            --body "Automatic merge of zpix1/windisplay hit conflicts. Resolve locally:
          \`\`\`
          git fetch origin upstream-sync
          git switch upstream-sync
          # fix the conflict markers, then
          git commit -am resolve && git push
          \`\`\`" || echo "PR already open"
